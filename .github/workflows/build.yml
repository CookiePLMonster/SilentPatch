name: Build SilentPatch

on:
  push:
    branches: dev
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3'

      - name: Setup RenderWare SDK
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/DK22Pac/plugin-sdk.git $env:RUNNER_TEMP\plugin-sdk
          git -C "$env:RUNNER_TEMP\plugin-sdk" sparse-checkout set plugin_III/game_III/rw plugin_vc/game_vc/rw plugin_sa/game_sa/rw

          $sdk = "$env:RUNNER_TEMP\plugin-sdk"
          $games = @(
            @{ Dir='III'; Src='plugin_III/game_III'; Api='d3d8' },
            @{ Dir='VC';  Src='plugin_vc/game_vc';   Api='d3d8' },
            @{ Dir='SA';  Src='plugin_sa/game_sa';   Api='d3d9' }
          )
          foreach ($g in $games) {
            $dst = "rwsdk\$($g.Dir)\include\$($g.Api)"
            New-Item -ItemType Directory -Force -Path "$dst\rw" | Out-Null
            Copy-Item "$sdk\$($g.Src)\rw\*" "$dst\"
            Copy-Item "$sdk\$($g.Src)\rw\*.rpe" "$dst\rw\"
          }

          # Fix plugin-sdk headers for MSVC compatibility
          foreach ($g in $games) {
            $dst = "rwsdk\$($g.Dir)\include\$($g.Api)"
            (Get-Content "$dst\rwplcore.h") -replace 'extern void         \*&RwEngineInstance;', 'extern void         *RwEngineInstance;' | Set-Content "$dst\rwplcore.h"
          }
          (Get-Content rwsdk\SA\include\d3d9\rtanim.h) -replace '//RwInt32                             animKeyFrameSize;', 'RwInt32                             animKeyFrameSize;' | Set-Content rwsdk\SA\include\d3d9\rtanim.h

          $root = (Resolve-Path rwsdk).Path
          echo "RWG33SDK=$root\III" >> $env:GITHUB_ENV
          echo "RWG34SDK=$root\VC" >> $env:GITHUB_ENV
          echo "RWG36SDK=$root\SA" >> $env:GITHUB_ENV

      - name: Install v141_xp toolset
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          $Arguments = ('/c', 'setup.exe', 'modify', '--installPath', "`"$InstallPath`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.WinXP',
            '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden

      - name: Build
        run: |
          vcpkg integrate install
          msbuild SilentPatch.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Copy INI files to Release
        shell: pwsh
        run: |
            Copy-Item Config/SilentPatchIII.ini Release/SilentPatchIII.ini
            Copy-Item Config/SilentPatchVC.ini Release/SilentPatchVC.ini
            Copy-Item Config/SilentPatchSA.ini Release/SilentPatchSA.ini

      - name: Upload SilentPatchIII
        uses: actions/upload-artifact@v7
        with:
          name: SilentPatchIII
          path: |
            Release/SilentPatchIII.asi
            Release/SilentPatchIII.ini

      - name: Upload SilentPatchVC
        uses: actions/upload-artifact@v7
        with:
          name: SilentPatchVC
          path: |
            Release/SilentPatchVC.asi
            Release/SilentPatchVC.ini

      - name: Upload SilentPatchSA
        uses: actions/upload-artifact@v7
        with:
          name: SilentPatchSA
          path: |
            Release/SilentPatchSA.asi
            Release/SilentPatchSA.ini

      - name: Upload DDraw
        uses: actions/upload-artifact@v7
        with:
          name: DDraw
          path: Release/ddraw.dll
