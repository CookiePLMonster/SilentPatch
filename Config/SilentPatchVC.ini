[SilentPatch]
; Allows to override units used by the game - 0 forces metric units, 1 forces imperial units,
; -1 makes the game use units based on system locale
Units=-1
; Enables fixes for corona placements on emergency vehicles and taxis
; This fixes siren placements on Police, Enforcer, Firetruck, Ambulance, FBI Rancher and Vice Cheetah,
; it also adds a siren to FBI Washington, corrects taxi sign light placement on Taxi
; and fixes placement of the search light and rear rotor light on Police Maverick.
EnableVehicleCoronaFixes=1
; Enables an unfinished "minimal HUD" feature, where health, armour, weapon and money UI elements
; fade out when inactive.
MinimalHUD=0
; Enables the sliding mission title text, based on remnants of this feature in the game code.
SlidingMissionTitleText=0
; Enables the sliding odd job text, based on remnants of this feature in the game code.
; This behaviour was visible in one of the beta clips released for GTA III.
SlidingOddJobText=0
; Enables a map blip for properties available to purchase. They were always created by the mission script,
; but did not show on the map.
ShowPropertyBlips=0
; By default, SilentPatch shrinks the radar disc texture by 2px to avoid gaps between the map and the disc.
; However, this may introduce issues with custom radar disc textures, for example the PS2 texture.
; With this option, you may opt-out of shrinking.
DontShrinkRadardisc=0
; Use the desktop refresh rate instead of a forced 60Hz while in fullscreen mode. This will get rid of
; a flicker when starting the game on a high refresh rate display.
UseDesktopRefreshRate=1
; Makes the script sprites scale to resolution. Disable only if you use CLEO mods that are aware of this issue
; and do the scaling themselves, to avoid double-scaling.
ScaleScriptSprites=1
; Speech Delay Timer (in ms)
; Adjust the delay time between NPC comments
; Set -1 to make the game use default delay time (6000ms)
SpeechDelayTimer=0

[ExtraCompSpecularityExceptions]
; Put model IDs or names (one ID/name per line) here to forcibly disable specularity on their extras
; Since SilentPatch applies proper environment maps on extras, specularity misconfigurations result
; in all extras being shiny, even if they are obviously meant not to be metallic.

; By default we exclude Stallion and Mesa Grande because of their leather roofs
stallion
mesa

